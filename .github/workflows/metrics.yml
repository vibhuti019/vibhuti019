name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      # Debug step to verify token exists
      - name: Check METRICS_TOKEN
        run: |
          if [ -n "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "✅ METRICS_TOKEN is set"
          else
            echo "❌ METRICS_TOKEN is NOT set"
            exit 1
          fi

      # Optional: check token length safely
      - name: Debug token length
        run: |
          echo "Token length: ${#TOKEN}"
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}

      # Generate GitHub Metrics
      - name: Metrics embed
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg

          # GitHub username
          user: vibhuti019

          # Base sections
          base: header, activity, community, repositories, metadata

          # Theme
          config_timezone: Asia/Kolkata
          config_display: large
          template: classic
          theme: tokyonight

          # Languages plugin
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: C

          # Calendar
          plugin_isocalendar: yes

          # Stars
          plugin_stars: yes

          # Repository follow-up
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Code lines
          plugin_lines: yes

          # Topics
          plugin_topics: yes
          plugin_topics_limit: 20

          # Coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14

          # Featured repositories
          plugin_repositories: yes
          plugin_repositories_featured: |
            vibhuti019/YOUR_REPO_NAME

        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
