name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: ${{ github.repository_owner }}
          template: classic
          base: header, community, repositories, metadata
          config_timezone: ${{ vars.USER_TIMEZONE || 'UTC' }} # Set your timezone in repository variables
          
          # 1. Languages Plugin (Visual breakdown of your code)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Analyzes code inside repos for more accuracy
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          
          # 2. Habits Plugin (Shows when you are most active)
          plugin_habits: no
          
          # 3. Achievements Plugin (Displays badges)
          plugin_achievements: no
          
          # 4. Isometric Calendar (The 3D commit graph)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 5. Notable Contributions
          plugin_notable: yes
          plugin_notable_from: all # Include organizations
          
          # 6. Activity Plugin (Recent activity feed)
          plugin_activity: no
